name: Push gem to RubyGems.org

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  build_source:
    name: Build Source Gem
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build standard source gem
        run: bundle exec rake build

      - name: Upload source gem artifact
        uses: actions/upload-artifact@v7
        with:
          name: gem-source
          path: pkg/tre_regex-*.gem
          retention-days: 1

  build_native:
    name: Build Native (${{ matrix.platform }})
    runs-on: ubuntu-latest
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - arm-linux-gnu
          - arm-linux-musl
          - arm64-darwin
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - x86-linux-gnu
          - x86-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false # Cannot use cache

      - name: Cross-compile all native platform gems
        run: |
          bundle install
          bundle exec rake gem:${{ matrix.platform }}

      - name: Upload native gem artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gem-native-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          retention-days: 1

  publish:
    name: Publish to RubyGems
    needs: [build_source, build_native]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download all gem artifacts
        uses: actions/download-artifact@v7
        with:
          path: pkg
          pattern: gem-*
          merge-multiple: true

      - name: Publish gems 🚀
        run: |
          for gem_file in pkg/*.gem; do
            echo "Pushing $gem_file..."
            gem push "$gem_file"
          done
