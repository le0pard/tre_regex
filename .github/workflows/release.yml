name: Push gem to RubyGems.org

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  build_source:
    name: Build Source Gem
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build standard source gem
        run: bundle exec rake build

      - name: Upload source gem artifact
        uses: actions/upload-artifact@v7
        with:
          name: gem-source
          path: pkg/tre_regex-*.gem
          retention-days: 1

  test_source:
    name: Test Source Gem (${{ matrix.os }})
    needs: build_source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -yq --no-install-recommends build-essential autoconf automake libtool gettext autopoint pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in autoconf automake libtool gettext pkg-config; do
            brew list $pkg &>/dev/null || brew install $pkg
          done

      - name: Download source gem artifact
        uses: actions/download-artifact@v7
        with:
          name: gem-source
          path: pkg

      - name: Run Test Script
        shell: bash
        run: |
          chmod +x .github/scripts/test-gem-install.sh
          .github/scripts/test-gem-install.sh pkg

  build_native:
    name: Build Native (${{ matrix.platform }})
    runs-on: ubuntu-latest
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - aarch64-mingw-ucrt
          - arm-linux-gnu
          - arm-linux-musl
          - arm64-darwin
          - x64-mingw-ucrt
          - x86-linux-gnu
          - x86-linux-musl
          - x86_64-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false # Cannot use cache

      - name: Cross-compile all native platform gems
        run: |
          bundle install
          bundle exec rake gem:${{ matrix.platform }}

      - name: Upload native gem artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gem-native-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          retention-days: 1

  test_native:
    name: Test Native Gem (${{ matrix.platform }})
    needs: build_native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Map the compiled platforms to actual physical GitHub runners
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-gnu
          - os: macos-26-intel # Intel Mac
            platform: x86_64-darwin
          - os: macos-26 # Apple Silicon Mac
            platform: arm64-darwin
          - os: windows-latest
            platform: x64-mingw-ucrt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Download gem artifact
        uses: actions/download-artifact@v7
        with:
          name: gem-native-${{ matrix.platform }}
          path: pkg

      - name: Run Test Script
        shell: bash
        run: |
          chmod +x .github/scripts/test-gem-install.sh
          .github/scripts/test-gem-install.sh pkg

  publish:
    name: Publish to RubyGems
    needs: [build_source, test_source, build_native, test_native]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download all gem artifacts
        uses: actions/download-artifact@v7
        with:
          path: pkg
          pattern: gem-*
          merge-multiple: true

      - name: Attribute commits to last committer
        shell: bash
        run: |
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global user.name "$(git log -1 --pretty=format:'%an')"

      - name: Configure Git using cached credentials
        shell: bash
        run: |
          git credential-cache --timeout=300 store <<EOF
          protocol=https
          host=github.com
          username=x-access-token
          password=${{ github.token }}

          EOF
          git config --local credential.helper 'cache --timeout=300'

      # - name: Configure trusted publishing credentials
      #   uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0

      # - name: Publish gems 🚀
